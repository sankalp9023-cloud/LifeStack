      summary: Delete a saved manual backup
      parameters:
        - name: backupId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Backup deleted.
        default:
          $ref: '#/components/responses/Error'

components:
  securitySchemes:
    lifeStackSession:
      type: apiKey
      in: cookie
      name: lifestack_session
  parameters:
    Limit:
      name: limit
      in: query
      description: Page size; default 25, maximum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor returned by the prior page.
      schema: { type: string }
    Search:
      name: q
      in: query
      description: Case-insensitive search over the resource's searchable text fields.
      schema: { type: string }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string }
    ChapterId:
      name: chapterId
      in: path
      required: true
      schema: { type: string }
    TopicId:
      name: topicId
      in: path
      required: true
      schema: { type: string }
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    SubjectList:
      description: Subject page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubjectPage'
    ChapterList:
      description: Chapter collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ChapterPage'
    TopicList:
      description: Topic collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TopicPage'
    ActivityList:
      description: Learning activity collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LearningActivityPage'
    StudyNoteList:
      description: Study note page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudyNotePage'
    RevisionList:
      description: Revision collection.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RevisionPage'
    PracticeSessionList:
      description: Practice session page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/PracticeSessionPage'
    AssessmentList:
      description: Assessment page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AssessmentPage'
    StudySessionList:
      description: Study session page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/StudySessionPage'
    ProjectList:
      description: Project page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectPage'
    MilestoneList:
      description: Milestone page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MilestonePage'
    ProjectNoteList:
      description: Project note page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProjectNotePage'
    ResourceList:
      description: Project resource page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResourcePage'
    ImportantDateList:
      description: Important date page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ImportantDatePage'
    ActivityLogList:
      description: Project activity log page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ActivityLogPage'
    TaskList:
      description: Task page.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/TaskPage'
  schemas:
    AuthSignup:
      type: object
      required: [name, email, password]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 128 }
    AuthLogin:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }
    GoogleAuthRequest:
      type: object
      required: [idToken]
      additionalProperties: false
      properties:
        idToken: { type: string, minLength: 1, maxLength: 8192 }
    AuthUser:
      type: object
      required: [id, email, name, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
    AuthResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [user]
          properties:
            user: { $ref: '#/components/schemas/AuthUser' }
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code:
              type: string
              examples: [VALIDATION_ERROR]
            message: { type: string }
            fields:
              type: object
              additionalProperties:
                type: string
            requestId: { type: string }
    PageInfo:
      type: object
      required: [limit, nextCursor, hasMore]
      properties:
        limit: { type: integer, minimum: 1, maximum: 100 }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    Page:
      type: object
      required: [data, page]
      properties:
        data: { type: array, items: {} }
        page: { $ref: '#/components/schemas/PageInfo' }
    Subject:
      type: object
      required: [id, name, goal, description, createdAt]
      properties:
        id: { type: string }
        name: { type: string, minLength: 1 }
        goal: { type: string }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    SubjectInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        goal: { type: string }
        description: { type: string }
    Chapter:
      type: object
      required: [id, subjectId, name, description, createdAt]
      properties:
        id: { type: string }
        subjectId: { type: string }
        name: { type: string, minLength: 1 }
        description: { type: string }
        createdAt: { type: string, format: date-time }
    ChapterInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: string }
    Topic:
      type: object
      required: [id, chapterId, name, requirements, createdAt]
      properties:
        id: { type: string }
        chapterId: { type: string }
        name: { type: string, minLength: 1 }
        requirements:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [lecture, reading, practice] }
        createdAt: { type: string, format: date-time }
    TopicInput:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        requirements:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, enum: [lecture, reading, practice] }
