openapi: 3.1.0
info:
  title: LifeStack API
  version: 1.0.0
  description: >-
    Versioned REST contract aligned to LifeStack's current Study, Projects,
    Tasks, Settings, and Dashboard frontend data shapes. This contract does not
    select a hosting platform. Account authentication uses opaque
    sessions in an HTTP-only cookie; Tasks routes and core Projects/milestone
    operations are implemented, with other private feature APIs still pending.
    Responses use a {data} envelope; errors use {error:{code,message,fields,requestId}}.
    List endpoints use opaque cursors, default limit 25 and maximum limit 100,
    with stable ordering by updatedAt,id or createdAt,id. Expected error statuses
    are 400 malformed input, 404 missing resource, 409 conflict, 422 validation,
    and 500 unexpected server error. Date-only fields use YYYY-MM-DD. Optional
    IDs and dates retain the frontend's empty-string convention; timestamps and
    nullable result/completion values retain their existing types.
servers:
  - url: /api/v1
tags:
  - name: Health
  - name: Auth
  - name: Dashboard
  - name: Study
  - name: Projects
  - name: Tasks
  - name: Settings
  - name: Backups
paths:
  /health:
    get:
      tags: [Health]
      summary: Check whether the API process is live
      responses:
        '200':
          description: API process is running.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: ok }

  /ready:
    get:
      tags: [Health]
      summary: Check database connectivity and supported PostgreSQL version
      responses:
        '200':
          description: Database is reachable and supported.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [status]
                    properties:
                      status: { type: string, const: ready }
        '503':
          description: Database is unavailable or below the supported version.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create an email and password account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthSignup' }
      responses:
        '201':
          description: Account created and session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '409': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Start an email and password session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AuthLogin' }
      responses:
        '200':
          description: User returned and session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/google:
    post:
      tags: [Auth]
      summary: Verify a Google identity token and start a session
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoogleAuthRequest' }
      responses:
        '200':
          description: User returned and session cookie set.
          headers:
            Set-Cookie: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Read the current authenticated user
      security: [{ lifeStackSession: [] }]
      responses:
        '200':
          description: Current user profile.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Error' }
        default: { $ref: '#/components/responses/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      security: [{ lifeStackSession: [] }]
      responses:
        '200':
          description: Session revoked and cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [signedOut]
                    properties:
                      signedOut: { type: boolean, const: true }
        default: { $ref: '#/components/responses/Error' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Get cross-module dashboard aggregates
      responses:
        '200':
          description: Dashboard cards and recent task activity.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/DashboardSummary'
        default:
          $ref: '#/components/responses/Error'

  /study/workspace:
    get:
      tags: [Study]
      summary: Get Study collections in the current frontend snapshot shape
      responses:
        '200':
          description: Complete Study workspace snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudyWorkspace'
        default:
          $ref: '#/components/responses/Error'

  /study/overview:
    get:
      tags: [Study]
      summary: Get Study dashboard metrics
      responses:
        '200':
          description: Subject, topic, revision, test, and recent activity aggregates.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudyOverview'
        default:
          $ref: '#/components/responses/Error'

  /study/subjects:
    get:
      tags: [Study]
      summary: List subjects
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/SubjectList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Create a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectInput'
      responses:
        '201':
          description: Subject created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Subject'
        default:
          $ref: '#/components/responses/Error'

  /study/subjects/{subjectId}:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Study]
      summary: Get a subject
      responses:
        '200':
          description: Subject record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Subject'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Study]
      summary: Update subject fields
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubjectInput'
      responses:
        '200':
          description: Updated subject.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Subject'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete subject and cascade its owned learning tree
      description: >-
        Deletes chapters, topics, activities, revisions, notes, practice sessions,
        and assessments. Study sessions are retained and detached from the subject
        and topic. Apply the operation atomically.
      responses:
        '204':
          description: Subject deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/subjects/{subjectId}/chapters:
    parameters:
      - $ref: '#/components/parameters/SubjectId'
    get:
      tags: [Study]
      summary: List a subject's chapters
      responses:
        '200':
          $ref: '#/components/responses/ChapterList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Add a chapter to a subject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterInput'
      responses:
        '201':
          description: Chapter created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Chapter'
        default:
          $ref: '#/components/responses/Error'

  /study/chapters/{chapterId}:
    parameters:
      - $ref: '#/components/parameters/ChapterId'
    patch:
      tags: [Study]
      summary: Update a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChapterInput'
      responses:
        '200':
          description: Updated chapter.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Chapter'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete a chapter and its topics
      description: >-
        Deletes topics, their activities and revisions. Notes and sessions are
        retained with chapter/topic references cleared; assessments retain their
        records with deleted topic IDs removed. Apply atomically.
      responses:
        '204':
          description: Chapter deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/chapters/{chapterId}/topics:
    parameters:
      - $ref: '#/components/parameters/ChapterId'
    get:
      tags: [Study]
      summary: List a chapter's topics
      responses:
        '200':
          $ref: '#/components/responses/TopicList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Add a topic to a chapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicInput'
      responses:
        '201':
          description: Topic created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Topic'
        default:
          $ref: '#/components/responses/Error'

  /study/topics/{topicId}:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    patch:
      tags: [Study]
      summary: Update a topic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TopicInput'
      responses:
        '200':
          description: Updated topic.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Topic'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete a topic and its activities and revisions
      description: Notes and sessions are retained with the topic reference cleared.
      responses:
        '204':
          description: Topic deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/topics/{topicId}/activities:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [Study]
      summary: List a topic's learning activities
      responses:
        '200':
          $ref: '#/components/responses/ActivityList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Add a learning activity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningActivityInput'
      responses:
        '201':
          description: Activity created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LearningActivity'
        default:
          $ref: '#/components/responses/Error'

  /study/activities/{activityId}:
    parameters:
      - name: activityId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Study]
      summary: Update activity text or completion state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LearningActivityPatch'
      responses:
        '200':
          description: Updated activity.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/LearningActivity'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete a learning activity
      responses:
        '204':
          description: Activity deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/notes:
    get:
      tags: [Study]
      summary: List study notes
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subjectId
          in: query
          schema: { type: string }
        - name: chapterId
          in: query
          schema: { type: string }
        - name: topicId
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/StudyNoteList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Create a study note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyNoteInput'
      responses:
        '201':
          description: Note created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudyNote'
        default:
          $ref: '#/components/responses/Error'

  /study/notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Study]
      summary: Update a study note
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudyNotePatch'
      responses:
        '200':
          description: Updated note.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudyNote'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete a study note
      responses:
        '204':
          description: Note deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/topics/{topicId}/revisions:
    parameters:
      - $ref: '#/components/parameters/TopicId'
    get:
      tags: [Study]
      summary: List revisions for a topic
      responses:
        '200':
          $ref: '#/components/responses/RevisionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Schedule a revision
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionInput'
      responses:
        '201':
          description: Revision scheduled.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Error'

  /study/revisions/{revisionId}:
    parameters:
      - name: revisionId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Study]
      summary: Update revision date, notes, or completion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionPatch'
      responses:
        '200':
          description: Updated revision.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Revision'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete a revision
      responses:
        '204':
          description: Revision deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/practice-sessions:
    get:
      tags: [Study]
      summary: List practice sessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subjectId
          in: query
          schema: { type: string }
        - name: topicId
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/PracticeSessionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Record a practice session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PracticeSessionInput'
      responses:
        '201':
          description: Practice session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/PracticeSession'
        default:
          $ref: '#/components/responses/Error'

  /study/practice-sessions/{sessionId}:
    delete:
      tags: [Study]
      summary: Delete a practice session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Practice session deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/assessments:
    get:
      tags: [Study]
      summary: List assessments
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subjectId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/AssessmentList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Create an assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentInput'
      responses:
        '201':
          description: Assessment created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Assessment'
        default:
          $ref: '#/components/responses/Error'

  /study/assessments/{assessmentId}:
    parameters:
      - name: assessmentId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Study]
      summary: Update an assessment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentPatch'
      responses:
        '200':
          description: Updated assessment.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Assessment'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Study]
      summary: Delete an assessment
      responses:
        '204':
          description: Assessment deleted.
        default:
          $ref: '#/components/responses/Error'

  /study/sessions:
    get:
      tags: [Study]
      summary: List study sessions
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: subjectId
          in: query
          schema: { type: string }
        - name: topicId
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          $ref: '#/components/responses/StudySessionList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Study]
      summary: Record a study session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudySessionInput'
      responses:
        '201':
          description: Study session created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/StudySession'
        default:
          $ref: '#/components/responses/Error'

  /study/sessions/{sessionId}:
    delete:
      tags: [Study]
      summary: Delete a study session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        '204':
          description: Study session deleted.
        default:
          $ref: '#/components/responses/Error'

  /projects/workspace:
    get:
      tags: [Projects]
      summary: Get project collections in the current frontend snapshot shape
      responses:
        '200':
          description: Project workspace snapshot.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectWorkspace'
        default:
          $ref: '#/components/responses/Error'

  /projects/overview:
    get:
      tags: [Projects]
      summary: Get project dashboard metrics
      responses:
        '200':
          description: Project counts, deadlines, overdue items, and recently updated projects.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/ProjectOverview'
        default:
          $ref: '#/components/responses/Error'

  /projects:
    get:
      tags: [Projects]
      summary: List and filter projects
      security: [{ lifeStackSession: [] }]
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            type: string
            enum: [not_started, active, on_hold, completed, archived]
        - name: category
          in: query
          schema: { type: string }
      responses:
        '200':
          $ref: '#/components/responses/ProjectList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Projects]
      summary: Create a project
      security: [{ lifeStackSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      summary: Get a project
      security: [{ lifeStackSession: [] }]
      responses:
        '200':
          description: Project record.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Projects]
      summary: Update project fields, including status
      security: [{ lifeStackSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatch'
      responses:
        '200':
          description: Updated project.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Project'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Projects]
      summary: Delete a project and its owned records
      security: [{ lifeStackSession: [] }]
      description: >-
        Deletes milestones, notes, resources, important dates, and project
        activities. Tasks are preserved with projectId and milestoneId cleared.
        Apply the operation atomically.
      responses:
        '204':
          description: Project and owned records deleted.
        default:
